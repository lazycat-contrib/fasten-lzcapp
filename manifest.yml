lzc-sdk-version: "0.1"
name: Fasten
package: cloud.lazycat.app.fasten
version: 1.1.3
description: 开源、自托管的个人/家庭电子病历聚合器
homepage: https://github.com/fastenhealth/fasten-onprem
author: fastenhealth
application:
  subdomain: fasten
  background_task: true
  multi_instance: false
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  routes:
    - /=http://fasten.cloud.lazycat.app.fasten.lzcapp:8080/
  public_path:
    - /
services:
  fasten:
    image: registry.lazycat.cloud/czyt/fastenhealth/fasten-onprem:693401d0f5394ff4
    binds:
      - /lzcapp/var/db:/opt/fasten/db
