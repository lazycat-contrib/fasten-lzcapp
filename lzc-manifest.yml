application:
  subdomain: fasten
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://fasten:8080/
services:
  fasten:
    # upstream: ghcr.io/fastenhealth/fasten-onprem:main-v1.1.3
    image: registry.lazycat.cloud/czyt/fastenhealth/fasten-onprem:fc7bde8dfea1f441
    binds:
      - /lzcapp/var/db:/opt/fasten/db
